
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obsidian — Premium Dark</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #08090d;
    --surface: #101116;
    --border: rgba(255,255,255,.09);
    --text: #f5f5f7;
    --muted: #777985;
    --accent: #a78bfa;
}

body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, Arial, sans-serif;
    overflow-x: hidden;
    transition: .4s ease;
}

body.light {
    --bg: #f4f3f0;
    --surface: #ffffff;
    --border: rgba(0,0,0,.09);
    --text: #17171b;
    --muted: #777;
    --accent: #7555c9;
}

.background-glow {
    position: fixed;
    width: 600px;
    height: 600px;
    top: -250px;
    left: 50%;
    transform: translateX(-50%);
    background: radial-gradient(
        circle,
        rgba(124, 89, 220, .15),
        transparent 70%
    );
    pointer-events: none;
    z-index: -1;
}

.navbar {
    height: 85px;
    max-width: 1250px;
    margin: auto;
    padding: 0 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: 3px;
}

.logo-icon {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg,#a78bfa,#5141a3);
    box-shadow: 0 0 25px rgba(167,139,250,.3);
}

.nav-right {
    display: flex;
    align-items: center;
    gap: 22px;
}

.status {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 2px;
}

.theme-btn {
    width: 43px;
    height: 43px;
    border: 1px solid var(--border);
    border-radius: 50%;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 18px;
    transition: .3s;
}

.theme-btn:hover {
    transform: rotate(25deg);
    border-color: var(--accent);
}

main {
    max-width: 1250px;
    min-height: calc(100vh - 145px);
    margin: auto;
    padding: 55px 35px 40px;
    display: flex;
    flex-direction: column;
}

.top-line {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 3px;
}

.center-stage {
    flex: 1;
    min-height: 480px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

.orbit {
    width: min(430px, 75vw);
    aspect-ratio: 1;
    border: 1px solid var(--border);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    animation: float 7s ease-in-out infinite;
}

.orbit::before,
.orbit::after {
    content: "";
    position: absolute;
    border: 1px solid var(--border);
    border-radius: 50%;
}

.orbit::before {
    width: 78%;
    height: 78%;
}

.orbit::after {
    width: 56%;
    height: 56%;
}

.core {
    width: 125px;
    height: 125px;
    border-radius: 35px;
    transform: rotate(45deg);
    background: linear-gradient(
        135deg,
        #c4b5fd,
        #8063d9 45%,
        #292044
    );
    box-shadow:
        0 0 60px rgba(139,92,246,.3),
        inset 0 0 30px rgba(255,255,255,.2);
    animation: rotate 15s linear infinite;
    z-index: 2;
}

.dot {
    position: absolute;
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 20px var(--accent);
}

.dot.one {
    top: 13%;
    left: 30%;
}

.dot.two {
    bottom: 22%;
    right: 12%;
}

.dot.three {
    top: 45%;
    right: 3%;
}

.side-detail {
    position: absolute;
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 14px 19px;
    border-radius: 12px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 2px;
    backdrop-filter: blur(15px);
}

.detail-left {
    left: 3%;
    top: 30%;
}

.detail-right {
    right: 3%;
    bottom: 27%;
}

.bottom-line {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 25px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 2px;
}

.bottom-mark {
    display: flex;
    align-items: center;
    gap: 8px;
}

.bottom-mark span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #a78bfa;
    box-shadow: 0 0 10px #a78bfa;
}

@keyframes rotate {
    to { transform: rotate(405deg); }
}

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
}

@media(max-width:650px) {
    .navbar {
        padding: 0 20px;
        height: 70px;
    }

    main {
        padding: 35px 20px 25px;
    }

    .center-stage {
        min-height: 500px;
    }

    .orbit {
        width: 75vw;
    }

    .core {
        width: 85px;
        height: 85px;
    }

    .side-detail {
        font-size: 8px;
        padding: 10px;
    }

    .detail-left {
        left: 0;
    }

    .detail-right {
        right: 0;
    }

    .status {
        display: none;
    }
}
</style>
</head>

<body>

<div class="background-glow"></div>

<header class="navbar">
    <div class="logo">
        <div class="logo-icon"></div>
        <span>OBSIDIAN</span>
    </div>

    <div class="nav-right">
        <span class="status">DIGITAL EXPERIENCE</span>
        <button class="theme-btn" id="themeBtn">☼</button>
    </div>
</header>

<main>
    <div class="top-line">
        <span>EST. 2026</span>
        <span>NO. 001 — DESIGN SYSTEM</span>
    </div>

    <section class="center-stage">

        <div class="side-detail detail-left">
            ◈ &nbsp; MINIMAL
        </div>

        <div class="orbit">
            <div class="core"></div>
            <div class="dot one"></div>
            <div class="dot two"></div>
            <div class="dot three"></div>
        </div>

        <div class="side-detail detail-right">
            ✦ &nbsp; ELEGANCE
        </div>

    </section>

    <footer class="bottom-line">
        <div class="bottom-mark">
            <span></span>
            SYSTEM ACTIVE
        </div>
        <div>DESIGNED IN SILENCE</div>
        <div>© 2026</div>
    </footer>
</main>

<script>
const themeBtn = document.getElementById("themeBtn");

themeBtn.addEventListener("click", () => {
    document.body.classList.toggle("light");

    themeBtn.textContent =
        document.body.classList.contains("light") ? "☾" : "☼";
});
</script>

</body>
</html>
